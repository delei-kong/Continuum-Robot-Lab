[project]
name = "continuum-robot-lab"
version = "0.1.0"
description = "Simulation, modeling, and control research for tendon-driven continuum robots"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
